<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Study Assistant</title>
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f5d50'/%3E%3Cpath d='M9 9h9a5 5 0 0 1 5 5v9H14a5 5 0 0 1-5-5z' fill='%23f6f1e7'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try {
      const t = localStorage.getItem("sa-theme");
      if (t) document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-mark" viewBox="0 0 24 24"><path d="M5 5h8a6 6 0 0 1 6 6v8h-8a6 6 0 0 1-6-6z" fill="currentColor"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v7a2.5 2.5 0 0 1-2.5 2.5H10l-4 4v-4h0A2 2 0 0 1 4 14z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
  <symbol id="i-card" viewBox="0 0 24 24"><rect x="3.5" y="6" width="17" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M7 10h10M7 13.5h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M5 19V11M12 19V5M19 19v-5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V6M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M19 14.5A7.5 7.5 0 0 1 9.5 5a7.5 7.5 0 1 0 9.5 9.5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-pdf" viewBox="0 0 24 24"><path d="M7 3.5h7l4.5 4.5v11A1.5 1.5 0 0 1 17 20.5H7A1.5 1.5 0 0 1 5.5 19V5A1.5 1.5 0 0 1 7 3.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M13.5 3.5V8.5h5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="9" cy="10" r="1.6" fill="currentColor"/><path d="m5 17 4.5-4.5 3 3L15 13l4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
  <symbol id="i-audio" viewBox="0 0 24 24"><path d="M5 10v4M9 7v10M13 4v16M17 8v8M21 11v2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M5 15v3.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 17h6M10 20h4M12 3a6 6 0 0 0-3.5 10.9c.4.3.5.7.5 1.1v.5h6V15c0-.4.2-.8.5-1.1A6 6 0 0 0 12 3z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-cross" viewBox="0 0 24 24"><path d="M7 7l10 10M17 7 7 17" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
  <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 5h5v5M19 5l-8 8M17 14v4a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1h4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-caret" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5.5" y="10.5" width="13" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M4 7a2 2 0 0 1 2-2h3.5l2 2H18a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
  <symbol id="i-files" viewBox="0 0 24 24"><path d="M8 4.5h6l4 4V17a1.5 1.5 0 0 1-1.5 1.5h-7A1.5 1.5 0 0 1 8 17z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M5.5 7.5V19A2.5 2.5 0 0 0 8 21.5h7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.7" fill="currentColor"/><circle cx="12" cy="12" r="1.7" fill="currentColor"/><circle cx="12" cy="19" r="1.7" fill="currentColor"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m15.5 15.5 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="13" y="4" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="4" y="13" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="13" y="13" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
</svg>

<div class="shell" id="shell">
  <aside class="sidebar" id="sidebar" aria-label="Navigation">
    <div class="brand">
      <span class="brand-mark"><svg><use href="#i-mark"/></svg></span>
      <div>
        <div class="brand-name">Study Assistant</div>
        <div class="brand-sub"><svg class="ico-xs"><use href="#i-lock"/></svg> Runs on this computer</div>
      </div>
      <button class="icon-btn only-mobile" id="close-sidebar" aria-label="Close menu"><svg><use href="#i-close"/></svg></button>
    </div>

    <nav class="side-nav">
      <button class="side-link" id="nav-new"><svg><use href="#i-plus"/></svg> New conversation</button>
      <button class="side-link" id="nav-subjects"><svg><use href="#i-grid"/></svg> Subjects</button>
    </nav>

    <section class="side-section">
      <h2 class="side-heading">Subjects</h2>
      <nav id="subject-list" class="subject-list"></nav>
    </section>

    <section class="side-section">
      <h2 class="side-heading">Recents</h2>
      <nav id="recent-list" class="recent-list"></nav>
    </section>

    <div class="side-foot" id="side-foot"></div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main" id="main">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="open-sidebar" aria-label="Open menu"><svg><use href="#i-menu"/></svg></button>
      <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
      <button class="icon-btn" id="theme-toggle" aria-label="Toggle dark mode"><svg><use href="#i-moon"/></svg></button>
    </header>

    <div id="indexing" class="indexing" hidden></div>

    <!-- The subjects grid -->
    <section id="view-subjects" class="view page" hidden>
      <div class="page-head">
        <h1>Subjects</h1>
        <form id="new-subject" class="new-subject" autocomplete="off">
          <input id="new-subject-name" placeholder="Name a new subject…" aria-label="New subject name" maxlength="80">
          <button class="btn primary"><svg><use href="#i-plus"/></svg> New subject</button>
        </form>
      </div>
      <div class="subject-grid" id="subject-grid"></div>
    </section>

    <!-- One subject: start a conversation, pick up an old one -->
    <section id="view-subject" class="view page" hidden>
      <div class="subject-layout">
        <div class="subject-main">
          <h1 id="subject-name"></h1>
          <p class="meta" id="subject-meta"></p>

          <!-- An empty subject has nothing to ask about, so the page offers the
               one thing that helps instead of a composer that cannot be used. -->
          <div class="onboard" id="subject-onboard" hidden></div>

          <form class="composer start" id="composer">
            <div class="composer-box">
              <textarea id="question" rows="2" placeholder="Ask a question…" aria-label="Your question"></textarea>
              <button class="send" id="send" aria-label="Ask"><svg><use href="#i-send"/></svg></button>
            </div>
            <p class="composer-note">Answers come only from this subject's documents · <kbd>Enter</kbd> to ask</p>
          </form>

          <div class="section-title" id="recents-title"><h2>Recents</h2></div>
          <div class="chat-rows" id="chat-rows"></div>
        </div>

        <aside class="rail" id="rail"></aside>
      </div>
    </section>

    <!-- A conversation -->
    <section id="view-chat" class="view ask" hidden>
      <div class="conversation" id="conversation" aria-live="polite"></div>
      <form class="composer" id="thread-composer">
        <div class="composer-box">
          <textarea id="thread-question" rows="1" placeholder="Ask a follow-up…" aria-label="Your question"></textarea>
          <button class="send" id="thread-send" aria-label="Ask"><svg><use href="#i-send"/></svg></button>
        </div>
        <p class="composer-note">Answers come only from this subject's documents · <kbd>Enter</kbd> to ask · <kbd>Shift</kbd>+<kbd>Enter</kbd> for a new line</p>
      </form>
    </section>

    <!-- Quiz -->
    <section id="view-quiz" class="view quiz" hidden>
      <div class="quiz-controls" id="quiz-controls">
        <label class="select">
          <span>Topic</span>
          <select id="topic-select"></select>
        </label>
        <button class="btn primary" id="new-question"><svg><use href="#i-card"/></svg> New question</button>
      </div>
      <div id="quiz-stage" class="quiz-stage"></div>
    </section>

    <!-- Progress -->
    <section id="view-progress" class="view progress" hidden>
      <div id="progress-body"></div>
    </section>
  </main>

  <aside class="drawer" id="drawer" aria-hidden="true" aria-label="Source passage">
    <header class="drawer-head">
      <div>
        <div class="eyebrow" id="drawer-eyebrow">Source</div>
        <h3 id="drawer-title"></h3>
        <p class="meta" id="drawer-meta"></p>
      </div>
      <button class="icon-btn" id="drawer-close" aria-label="Close"><svg><use href="#i-close"/></svg></button>
    </header>
    <blockquote id="drawer-text" class="passage"></blockquote>
    <a class="btn ghost" id="drawer-open" target="_blank" rel="noopener"><svg><use href="#i-external"/></svg> Open the file</a>
  </aside>
</div>

<input type="file" id="file-input" multiple hidden>

<dialog id="confirm" class="dialog">
  <form method="dialog">
    <h3 id="confirm-title"></h3>
    <p id="confirm-text"></p>
    <menu>
      <button value="cancel" class="btn ghost">Cancel</button>
      <button value="ok" class="btn danger" id="confirm-ok">Delete</button>
    </menu>
  </form>
</dialog>

<div class="toasts" id="toasts" role="status"></div>

<script src="app.js"></script>
</body>
</html>
